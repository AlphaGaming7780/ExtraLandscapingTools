name: Update translation progress

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write

jobs:
  update-progress:
    # Only run on the PR opened by Crowdin's GitHub integration
    if: startsWith(github.event.pull_request.title, 'New Crowdin updates')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Update translation progress in PublishConfiguration.xml
        env:
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}
        run: node scripts/update-crowdin-progress.mjs

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Properties/PublishConfiguration.xml
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update translation progress from Crowdin"
            git push
          fi
